<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>upload</title>
</head>
<body>
    <h1>Upload de Arquivo XML</h1>

    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="exercicio">Selecione a atividade:</label>
    <select name="exercicio_id" id="exercicio">
        {% for exercicio in exercicios %}
            <option value="{{ exercicio.id }}">{{ exercicio.titulo }}</option>
        {% endfor %}
    </select>

    {{ form.as_p }}

    <button type="submit">Comparar</button>
    <p>Resultado: {{ resultado_final }}%</p>
    </form>

</body>
</html>
